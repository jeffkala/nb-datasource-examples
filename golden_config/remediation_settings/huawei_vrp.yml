---
- platform_name: "huawei_vrp"
  remediation_type: "hierconfig"
  remediation_options:
    style: "huawei_vrp"
    negation_prefix: 'undo '
    declaration_prefix: ''
    indentation: 2
    rules:
      indent_adjust:
      - start_expression: '^\s*(rsa|dsa|ecc) peer-public-key '
        end_expression: ^\s*peer-public-key end
      per_line_sub:
      - search: ^\s*[#!].*
        replace: ''
